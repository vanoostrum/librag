name: Factory Contracts

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Factory Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install factory validator dependency
        run: python -m pip install -r factory/requirements.txt
      - name: Validate shared factory assets
        run: python factory/scripts/validate_factory.py
      - name: Exercise guard policy boundaries
        run: python -m unittest discover -s factory/tests -v
