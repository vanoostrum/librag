# LibRag as one stack: `docker compose up -d --build --wait`, then open http://localhost:8000.
# compose.test.yaml adds the test settings (fake AI providers).
name: librag

x-app: &app
  image: librag:local
  build: .
  environment:
    LIBRAG_QDRANT_URL: http://qdrant:6333
    LIBRAG_DATABASE_URL: sqlite:////data/librag.db
    LIBRAG_FILE_STORE_DIR: /data/files
    # Passed through from the shell when set. With the live providers, the worker
    # embeds with OpenAI and chat answers with OpenAI or Anthropic.
    LIBRAG_EMBEDDING_MODEL:
    OPENAI_API_KEY:
    ANTHROPIC_API_KEY:
  volumes:
    - librag-data:/data

services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:${LIBRAG_QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget, so ask /readyz over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          grep -q ' 200 ' <&3
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    ports:
      - "${LIBRAG_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      # 200 only when Qdrant, the database and the worker are all ready.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "librag.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  librag-data:
  qdrant-data:
