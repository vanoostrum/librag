<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LibRag{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body{% block body_attributes %}{% endblock %}>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="wordmark">LibRag</div>
      <nav class="main-nav" aria-label="Main">
        <a href="/"{% if nav == "library" %} aria-current="page"{% endif %}>Library</a>
        <a href="/chat"{% if nav == "chat" %} aria-current="page"{% endif %}>Chat</a>
      </nav>
    </div>
  </header>
  <main class="page">
    {% block main %}{% endblock %}
  </main>
  {% block after_main %}{% endblock %}
</body>
</html>
