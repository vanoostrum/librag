[project]
name = "librag"
version = "0.1.0"
description = "LibRag web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi",
    "httpx2>=2.16.0",
    "lxml>=6.1.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi-cli",
    "lxml-stubs>=0.5.1",
    "pytest",
    "pytest-cov",
    "pyyaml>=6.0.3",
    "ruff",
    "ty",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the Ruff formatter (missing-trailing-comma).
    "COM819", # Conflicts with the Ruff formatter (prohibited-trailing-comma).
    "D203", # Conflicts with the Ruff formatter and with D211 (blank line before class).
    "D206", # Conflicts with the Ruff formatter (docstring-tab-indentation).
    "D213", # Conflicts with D212 (multi-line docstring summary on the first line).
    "D300", # Conflicts with the Ruff formatter (triple-single-quotes).
    "E111", # Conflicts with the Ruff formatter (indentation-with-invalid-multiple).
    "E114", # Conflicts with the Ruff formatter (indentation-with-invalid-multiple-comment).
    "E117", # Conflicts with the Ruff formatter (over-indented).
    "Q000", # Conflicts with the Ruff formatter (bad-quotes-inline-string).
    "Q001", # Conflicts with the Ruff formatter (bad-quotes-multiline-string).
    "Q002", # Conflicts with the Ruff formatter (bad-quotes-docstring).
    "Q003", # Conflicts with the Ruff formatter (avoidable-escaped-quote).
    "Q004", # Conflicts with the Ruff formatter (unnecessary-escaped-quote).
    "W191", # Conflicts with the Ruff formatter (tab-indentation).
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on assert. S101 is limited to tests; application code stays checked.
"tests/**/*.py" = ["S101"]
# Claude Code runs hook scripts as standalone files, not as a package.
".claude/hooks/*.py" = ["INP001"]
# Alembic loads migration scripts by path, not as a package.
"src/librag/migrations/**/*.py" = ["INP001"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Fail on every diagnostic, not only on errors.
all = "error"

[tool.pytest.ini_options]
# tests/e2e runs against a running stack, so `uv run pytest` does not collect it.
testpaths = ["tests/unit", "tests/integration", "tests/repo"]
# Report line and branch coverage on every run. There is no minimum.
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["librag"]
branch = true
# Measure the worker process that tests/unit/test_worker.py starts.
patch = ["subprocess"]
