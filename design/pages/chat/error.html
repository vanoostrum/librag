<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · LibRag</title>
  <link rel="stylesheet" href="../../gallery.css">
</head>
<body class="chat-body">
  <header class="site-header">
    <div class="site-header__inner">
      <div class="wordmark">LibRag</div>
      <nav class="main-nav" aria-label="Main">
        <a href="../library/default.html">Library</a>
        <a href="answer.html" aria-current="page">Chat</a>
      </nav>
    </div>
  </header>
  <main class="page page--reading">
    <h1 class="visually-hidden">Chat</h1>
    <div class="chat-head">
      <h2 class="chat-head__title">Conversation</h2>
      <button type="button" class="button-quiet">New conversation</button>
    </div>
    <section class="turn">
      <p class="question">Which of the two gives practical advice for decision makers?</p>
      <div class="notice turn-error" role="alert">
        <span class="notice__text">The model didn't answer: Rate limit reached for gpt-6.1-terra. Try again in a minute.</span>
        <button type="button" class="button-quiet">Try again</button>
      </div>
    </section>
    <form class="ask">
      <div class="ask__bar">
        <label class="visually-hidden" for="question">Question</label>
        <input class="ask__input" id="question" type="text" placeholder="Ask your library a question">
        <button type="submit" class="button-primary">Ask</button>
      </div>
      <div class="ask__options">
        <label>Model <select><option>Claude Sonnet 5.5</option><option>GPT 6.1 Terra</option></select></label>
        <div class="picker">
          <button type="button" class="picker__toggle" aria-expanded="false">Books: 2 books ▾</button>
        </div>
      </div>
    </form>
  </main>
</body>
</html>
